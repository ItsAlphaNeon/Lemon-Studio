# The cutting-edge branch: full build and tests on Linux (Wayland/Hyprland) plus compile checks on Windows and macOS
# on every push so changes stay PR-ready for main.
name: CI (cutting-edge)

on:
  push:
    branches: [cutting-edge, 'cutting-edge-*']
  pull_request:
    branches: [cutting-edge, 'cutting-edge-*']
  workflow_dispatch:

concurrency:
  group: ci-cutting-edge-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            full: true
          - name: Windows (check)
            os: windows-latest
            full: false
          - name: macOS (check)
            os: macos-latest
            full: false
    steps:
      - uses: actions/checkout@v4

      # ALSA (audio output and MIDI input). The app loads Wayland, X11 and xkbcommon at run time, but Lemon Sampler built
      # on its own (the bundle step) links wayland-client through its file dialogs, so that needs the Wayland package.
      # libclang: the time stretcher's bindings are generated at build time (the Windows image ships LLVM, the macOS one Xcode's).
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libjack-jackd2-dev libwayland-dev libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        if: matrix.full
        run: cargo build --workspace --all-targets --locked

      - name: Check workspace
        if: ${{ !matrix.full }}
        run: cargo check --workspace --all-targets --locked

      - name: Check minimal build (features off)
        run: cargo check --locked -p lemonstudio --no-default-features --all-targets

      # The plugin bundles (VST3 + CLAP): the hosting tests load them, and skip without them.
      - name: Bundle plugins
        if: matrix.full
        run: cargo run -p bundle-plugins --locked

      # Every platform's crates: the notices test lists them with an offline `cargo tree --target all`.
      - name: Fetch
        if: matrix.full
        run: cargo fetch --locked

      - name: Test
        if: matrix.full
        run: cargo test --workspace --locked
