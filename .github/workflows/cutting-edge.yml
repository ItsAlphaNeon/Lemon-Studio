# The cutting-edge branch: Linux only (it puts Wayland first; Windows and macOS are not tested on every push here).
# Run the three-platform CI by hand (workflow_dispatch) when a change needs it.
name: CI (cutting-edge)

on:
  push:
    branches: [cutting-edge, 'cutting-edge-*']
  pull_request:
    branches: [cutting-edge, 'cutting-edge-*']
  workflow_dispatch:

concurrency:
  group: ci-cutting-edge-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ALSA (audio output and MIDI input). The app loads Wayland, X11 and xkbcommon at run time, but Lemon Sampler built
      # on its own (the bundle step) links wayland-client through its file dialogs, so that needs the Wayland package.
      # libclang: the time stretcher's bindings are generated at build time (the Windows image ships LLVM, the macOS one Xcode's).
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libwayland-dev libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # The plugin bundles (VST3 + CLAP): the hosting tests load them, and skip without them.
      - name: Bundle plugins
        run: cargo run -p bundle-plugins --locked

      - name: Bundle the app
        if: runner.os == 'macOS'
        run: cargo run -p bundle-app --locked

      - name: Test
        run: cargo test --workspace --locked
