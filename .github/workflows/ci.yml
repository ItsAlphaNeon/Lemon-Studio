# Builds and tests Lemon Studio on Windows and Linux for every push to main and every pull request, so a change that
# breaks either platform shows up before it is merged.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ALSA (audio output and MIDI input). The app loads Wayland, X11 and xkbcommon at run time, but Open Sampler built
      # on its own (the bundle step) links wayland-client through its file dialogs, so that needs the Wayland package.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libwayland-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # The plugin bundles (VST3 + CLAP): the hosting tests load them, and skip without them.
      - name: Bundle plugins
        run: cargo run -p bundle-plugins --locked

      - name: Test
        run: cargo test --workspace --locked
