# Builds and tests Lemon Studio on Windows, Linux and macOS for every push to main and every pull request, so a change
# that breaks any platform shows up before it is merged.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ALSA (audio output and MIDI input). The app loads Wayland, X11 and xkbcommon at run time, but Lemon Sampler built
      # on its own (the bundle step) links wayland-client through its file dialogs, so that needs the Wayland package.
      # libclang: the time stretcher's bindings are generated at build time (the Windows image ships LLVM, the macOS one Xcode's).
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libjack-jackd2-dev libwayland-dev libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # The session (the project, playing, recording, loading, saving) builds without the interface.
      - name: Build the session alone
        run: cargo check --locked -p os-session --all-targets

      # The program builds with its optional parts off (the session's features: VST 3 and VST 2 hosting, the export encoders, MIDI ports, the audio devices, FL Studio's native plugins, the control socket), all at once
      # and one at a time.
      - name: Build with features off
        run: |
          cargo check --locked -p lemonstudio --no-default-features --all-targets
          cargo check --locked -p lemonstudio --no-default-features --features vst3 --all-targets
          cargo check --locked -p lemonstudio --no-default-features --features vst2 --all-targets
          cargo check --locked -p lemonstudio --no-default-features --features export-flac --all-targets
          cargo check --locked -p lemonstudio --no-default-features --features export-mp3 --all-targets
          cargo check --locked -p lemonstudio --no-default-features --features export-ogg --all-targets
          cargo check --locked -p lemonstudio --no-default-features --features midi-io --all-targets
          cargo check --locked -p lemonstudio --no-default-features --features device --all-targets
          cargo check --locked -p lemonstudio --no-default-features --features fl-native --all-targets
          cargo check --locked -p lemonstudio --no-default-features --features rpc --all-targets

      # The plugin bundles (VST3 + CLAP): the hosting tests load them, and skip without them.
      - name: Bundle plugins
        run: cargo run -p bundle-plugins --locked

      - name: Bundle the app
        if: runner.os == 'macOS'
        run: cargo run -p bundle-app --locked

      # Every platform's crates: the notices test lists them with an offline `cargo tree --target all`.
      - name: Fetch
        run: cargo fetch --locked

      - name: Test
        run: cargo test --workspace --locked

      # What only the release workflow builds: a nightly's and a tagged release's settings still compile.
      - name: Check a nightly
        run: cargo check --locked -p lemonstudio
        env:
          LEMON_CHANNEL: nightly
          LEMON_VERSION: 2026.1.1.1

      - name: Check a tagged release
        run: cargo check --locked -p lemonstudio
        env:
          LEMON_CHANNEL: stable
          LEMON_VERSION: 0.1.0

      - name: Test the release scripts
        if: runner.os == 'Linux'
        run: bash tools/package/test.sh
