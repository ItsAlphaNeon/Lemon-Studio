[package]
name = "tesla"
description = "Tesla: Lemon Studio's audio editor and recorder (the counterpart of FL's Edison) as a VST3 / CLAP plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Compiled into Lemon Studio: no exported plugin entry points (they would clash with the other built-in plugins).
linked = []

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
os-engine.workspace = true
os-hostlink.workspace = true
os-plugkit = { path = "../../crates/os-plugkit" }
os-ui = { path = "../../crates/os-ui" }
os-theme = { path = "../../crates/os-theme" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Com", "Win32_System_SystemServices"] }

# The open / save dialogs (Windows has its own).
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rfd = "0.15"

[dev-dependencies]
tiny-skia = "0.11"
