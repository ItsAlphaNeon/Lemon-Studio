[package]
name = "os-native"
description = "Host for third-party native-format DAW plugins (interoperability, public SDK interface)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libloading = "0.8"
thiserror.workspace = true
os-engine.workspace = true
os-host.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Kernel"] }
