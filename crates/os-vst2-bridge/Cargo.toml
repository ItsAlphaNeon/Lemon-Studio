[package]
name = "os-vst2-bridge"
description = "Lemon Studio's VST 2 bridge: 32-bit plugins in a helper process"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[[bin]]
name = "lemonstudio-bridge32"
path = "src/bin/lemonstudio-bridge32.rs"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[dev-dependencies]
os-vst2.workspace = true
os-host.workspace = true
os-engine.workspace = true
