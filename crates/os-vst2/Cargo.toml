[package]
name = "os-vst2"
description = "Lemon Studio's VST 2 plugin host (clean-room interface, no Steinberg SDK)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libloading = "0.8"
os-engine.workspace = true
os-host.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }
