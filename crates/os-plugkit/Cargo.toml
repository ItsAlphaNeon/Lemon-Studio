[package]
name = "os-plugkit"
description = "Shared pieces of Lemon Studio's own plugin editors: live parameter edits, menus, native editor windows, popups and type-in boxes"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
default = ["gui"]
# The editors' native windows, popups and type-in boxes (`win`, `x11`, `mac`): off, the plugins built on this crate
# have no editor windows (a session with no interface).
gui = ["dep:windows-sys", "dep:x11rb", "dep:libc", "dep:objc2", "dep:block2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-core-foundation", "dep:objc2-core-graphics", "dep:objc2-quartz-core"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
os-hostlink.workspace = true
os-ui = { path = "../os-ui" }
os-theme = { path = "../os-theme" }

[target.'cfg(windows)'.dependencies]
windows-sys = { optional = true, version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { optional = true, version = "0.13", features = ["randr", "shape", "xinput"] }
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-foundation = { optional = true, version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSArray", "NSData", "NSEnumerator", "NSObject", "NSURL"] }
objc2-app-kit = { optional = true, version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core", "NSApplication", "NSColor", "NSResponder", "NSView", "NSEvent", "NSWindow", "NSPanel", "NSScreen", "NSTrackingArea", "NSCursor", "NSGraphics", "NSPasteboard", "NSDragging"] }
objc2-core-foundation = { optional = true, version = "0.3", default-features = false, features = ["std", "block2", "CFRunLoop", "CFString", "CFCGTypes"] }
objc2-core-graphics = { optional = true, version = "0.3", default-features = false, features = ["std", "objc2", "CGEvent", "CGEventTypes", "CGImage", "CGDataProvider", "CGColorSpace", "CGRemoteOperation", "CGDirectDisplay", "CGError", "libc"] }
objc2-quartz-core = { optional = true, version = "0.3", default-features = false, features = ["std", "CALayer", "CATransaction"] }
