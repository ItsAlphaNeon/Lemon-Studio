[package]
name = "os-app"
description = "OpenStudio: the application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openstudio"
path = "src/main.rs"

[dependencies]
os-model.workspace = true
os-flp.workspace = true
os-engine.workspace = true
os-hostlink.workspace = true
os-theme = { path = "../os-theme" }
os-ui = { path = "../os-ui" }
os-clap = { path = "../os-clap" }
open-sampler = { path = "../../plugins/open-sampler", features = ["linked"] }
open-parametric-eq-2 = { path = "../../plugins/open-parametric-eq-2", features = ["linked"] }
winit = "0.30"
softbuffer = "0.4"
cpal = "0.18"
rfd = "0.15"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Memory", "Win32_UI_Shell"] }
