[package]
name = "os-app"
description = "Lemon Studio: the application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lemonstudio"
path = "src/main.rs"

[dependencies]
os-model.workspace = true
os-dsp.workspace = true
os-flp.workspace = true
os-engine.workspace = true
os-hostlink.workspace = true
os-theme = { path = "../os-theme" }
os-ui = { path = "../os-ui" }
os-clap = { path = "../os-clap" }
os-native = { path = "../os-native" }
os-host.workspace = true
os-vst3.workspace = true
os-vst2.workspace = true
os-paths.workspace = true
lemon-sampler = { path = "../../plugins/lemon-sampler", features = ["linked"] }
lemon-parametric-eq-2 = { path = "../../plugins/lemon-parametric-eq-2", features = ["linked"] }
lemon-3x-osc = { path = "../../plugins/lemon-3x-osc", features = ["linked"] }
winit = "0.30"
softbuffer = "0.4"
cpal = "0.18"
crossbeam-queue = "0.3"
midir = "0.11"
tiny-skia = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Export encoders (`export::encode`): FLAC (pure Rust), MP3 (LAME, built from source) and Ogg Vorbis (libvorbis, built
# from source).
flacenc = "0.5"
mp3lame-encoder = "0.2"
vorbis_rs = "0.5"

[target.'cfg(windows)'.dependencies]
# ASIO output (`device::asio`), built from the ASIO SDK's host files in `asiosdk` (`.cargo/config.toml`).
asio-sys = "0.4"
# WASAPI exclusive and low-latency shared output (`device::wasapi`): the version cpal is built with.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Devices_Properties", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_UI_HiDpi", "Win32_System_Registry"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["resource_manager", "shape"] }

# The main window's chrome (`macos`) and plugin windows (`plugin_window::cocoa`): the objc2 crates softbuffer already
# uses.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSObjCRuntime", "NSString", "NSURL", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-quartz-core", "NSApplication", "NSEvent", "NSCell", "NSGraphics", "NSMenu", "NSMenuItem", "NSPanel", "NSResponder", "NSScreen", "NSTrackingArea", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "CGColorSpace", "CGDataProvider", "CGImage", "CGPath"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "CALayer", "CAShapeLayer", "CATransaction"] }
