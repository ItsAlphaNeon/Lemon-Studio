[package]
name = "os-app"
description = "Lemon Studio: the application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lemonstudio"
path = "src/main.rs"

[dependencies]
os-model.workspace = true
os-dsp.workspace = true
os-flp.workspace = true
os-engine.workspace = true
os-hostlink.workspace = true
os-theme = { path = "../os-theme" }
os-ui = { path = "../os-ui" }
os-clap = { path = "../os-clap" }
os-native = { path = "../os-native" }
os-host.workspace = true
os-vst3.workspace = true
os-vst2.workspace = true
os-paths.workspace = true
os-smf.workspace = true
lemon-sampler = { path = "../../plugins/lemon-sampler", features = ["linked"] }
lemon-parametric-eq-2 = { path = "../../plugins/lemon-parametric-eq-2", features = ["linked"] }
lemon-3x-osc = { path = "../../plugins/lemon-3x-osc", features = ["linked"] }
citrus = { path = "../../plugins/citrus", features = ["linked"] }
lemon-limiter = { path = "../../plugins/lemon-limiter", features = ["linked"] }
lemon-reverb = { path = "../../plugins/lemon-reverb", features = ["linked"] }
lemon-delay = { path = "../../plugins/lemon-delay", features = ["linked"] }
lemon-soft-clipper = { path = "../../plugins/lemon-soft-clipper", features = ["linked"] }
lemon-fast-distortion = { path = "../../plugins/lemon-fast-distortion", features = ["linked"] }
lemon-balance = { path = "../../plugins/lemon-balance", features = ["linked"] }
lemon-stereo-enhancer = { path = "../../plugins/lemon-stereo-enhancer", features = ["linked"] }
lemon-transient-processor = { path = "../../plugins/lemon-transient-processor", features = ["linked"] }
lemon-chorus = { path = "../../plugins/lemon-chorus", features = ["linked"] }
lemon-small-fx = { path = "../../plugins/lemon-small-fx" }
lemon-stereo-shaper = { path = "../../plugins/lemon-stereo-shaper", features = ["linked"] }
lemon-filter = { path = "../../plugins/lemon-filter", features = ["linked"] }
tesla = { path = "../../plugins/tesla", features = ["linked"] }
pulp-filter = { path = "../../plugins/pulp-filter", features = ["linked"] }
press = { path = "../../plugins/press", features = ["linked"] }
lemon-flanger = { path = "../../plugins/lemon-flanger", features = ["linked"] }
lemon-phaser = { path = "../../plugins/lemon-phaser", features = ["linked"] }
lemon-peak-controller = { path = "../../plugins/lemon-peak-controller", features = ["linked"] }
winit = "0.30"
softbuffer = "0.4"
cpal = "0.18"
crossbeam-queue = "0.3"
midir = "0.11"
tiny-skia = "0.11"
# JPEG workspace pictures of theme files (`wallpaper`; PNG goes through tiny-skia). Pure Rust, no threads.
jpeg-decoder = { version = "0.3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Export encoders (`export::encode`): FLAC (pure Rust), MP3 (LAME, built from source) and Ogg Vorbis (libvorbis, built
# from source).
flacenc = "0.5"
mp3lame-encoder = "0.2"
vorbis_rs = "0.5"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# ASIO output (`device::asio`), built from the ASIO SDK's host files in `asiosdk` (`.cargo/config.toml`).
asio-sys = "0.4"
# WASAPI exclusive and low-latency shared output (`device::wasapi`): the version cpal is built with.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Devices_Properties", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Shared mode plays through the sound server (PulseAudio, or PipeWire's pipewire-pulse) as other programs do; the
# PulseAudio host speaks the protocol in Rust, so no system library is linked. Exclusive mode opens ALSA directly.
cpal = { version = "0.18", features = ["pulseaudio"] }
# The cards the sound server gave up on while Lemon Studio had them through ALSA (`device::sound_server`): the
# protocol crate cpal's PulseAudio host is built on.
pulseaudio = "0.3"
x11rb = { version = "0.13", features = ["randr", "resource_manager", "shape"] }

# The main window's chrome (`macos`), plugin windows (`plugin_window::cocoa`) and the startup splash (`splash`): the
# objc2 crates softbuffer already uses.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSObjCRuntime", "NSString", "NSURL", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-quartz-core", "NSApplication", "NSColor", "NSCursor", "NSEvent", "NSCell", "NSGraphics", "NSMenu", "NSMenuItem", "NSPanel", "NSResponder", "NSScreen", "NSTrackingArea", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFDate", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "CGColorSpace", "CGDataProvider", "CGImage", "CGPath"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "CALayer", "CAShapeLayer", "CATransaction"] }
