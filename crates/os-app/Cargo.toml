[package]
name = "os-app"
description = "Lemon Studio: the application"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["vst3", "vst2", "export-flac", "export-mp3", "export-ogg", "midi-io", "rpc"]
# Hosting VST 3 and VST 2 plugins (the session's features).
vst3 = ["os-session/vst3"]
vst2 = ["os-session/vst2"]
# The export encoders (the session's features).
export-flac = ["os-session/export-flac"]
export-mp3 = ["os-session/export-mp3"]
export-ogg = ["os-session/export-ogg"]
# The system's MIDI ports.
midi-io = ["os-session/midi-io", "dep:midir"]
# Listening for control-plane clients.
rpc = ["os-session/rpc"]

[dependencies]
os-session = { path = "../os-session", default-features = false }
os-model.workspace = true
os-dsp.workspace = true
os-flp.workspace = true
os-engine.workspace = true
os-hostlink.workspace = true
os-theme = { path = "../os-theme" }
os-ui = { path = "../os-ui" }
os-clap = { path = "../os-clap" }
os-native = { path = "../os-native" }
os-host.workspace = true
os-vst3.workspace = true
os-vst2.workspace = true
os-paths.workspace = true
os-smf.workspace = true
lemon-sampler = { path = "../../plugins/lemon-sampler", features = ["linked", "editor"] }
lemon-parametric-eq-2 = { path = "../../plugins/lemon-parametric-eq-2", features = ["linked", "editor"] }
lemon-3x-osc = { path = "../../plugins/lemon-3x-osc", features = ["linked", "editor"] }
citrus = { path = "../../plugins/citrus", features = ["linked", "editor"] }
smith = { path = "../../plugins/smith", features = ["linked", "editor"] }
lemon-drum-sampler = { path = "../../plugins/lemon-drum-sampler", features = ["linked", "editor"] }
lemon-limiter = { path = "../../plugins/lemon-limiter", features = ["linked", "editor"] }
lemon-reverb = { path = "../../plugins/lemon-reverb", features = ["linked", "editor"] }
lemon-delay = { path = "../../plugins/lemon-delay", features = ["linked", "editor"] }
lemon-soft-clipper = { path = "../../plugins/lemon-soft-clipper", features = ["linked", "editor"] }
lemon-fast-distortion = { path = "../../plugins/lemon-fast-distortion", features = ["linked", "editor"] }
lemon-balance = { path = "../../plugins/lemon-balance", features = ["linked", "editor"] }
lemon-stereo-enhancer = { path = "../../plugins/lemon-stereo-enhancer", features = ["linked", "editor"] }
lemon-transient-processor = { path = "../../plugins/lemon-transient-processor", features = ["linked", "editor"] }
lemon-chorus = { path = "../../plugins/lemon-chorus", features = ["linked", "editor"] }
lemon-small-fx = { path = "../../plugins/lemon-small-fx", features = ["editor"] }
lemon-stereo-shaper = { path = "../../plugins/lemon-stereo-shaper", features = ["linked", "editor"] }
lemon-filter = { path = "../../plugins/lemon-filter", features = ["linked", "editor"] }
tesla = { path = "../../plugins/tesla", features = ["linked", "editor"] }
pulp-filter = { path = "../../plugins/pulp-filter", features = ["linked", "editor"] }
press = { path = "../../plugins/press", features = ["linked", "editor"] }
lemon-flanger = { path = "../../plugins/lemon-flanger", features = ["linked", "editor"] }
lemon-phaser = { path = "../../plugins/lemon-phaser", features = ["linked", "editor"] }
lemon-peak-controller = { path = "../../plugins/lemon-peak-controller", features = ["linked", "editor"] }
lemon-formula-controller = { path = "../../plugins/lemon-formula-controller", features = ["linked", "editor"] }
lemon-slicer = { path = "../../plugins/lemon-slicer", features = ["linked", "editor"] }
lemon-vocoder = { path = "../../plugins/lemon-vocoder", features = ["linked", "editor"] }
lemon-drop = { path = "../../plugins/lemon-drop", features = ["linked", "editor"] }
crossbeam-queue = "0.3"
midir = { version = "0.11", optional = true }
tiny-skia = "0.11"
# JPEG workspace pictures of theme files (`wallpaper`; PNG goes through tiny-skia). Pure Rust, no threads.
jpeg-decoder = { version = "0.3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Export encoders (`export::encode`): FLAC (pure Rust), MP3 (LAME, built from source) and Ogg Vorbis (libvorbis, built
# from source).
flacenc = "0.5"
mp3lame-encoder = "0.2"
vorbis_rs = "0.5"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
os-session = { path = "../os-session", default-features = false, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
# Clipboard audio, process statistics, known folders, file association, drag and drop (`audio_clipboard`, `cpu`,
# `filedlg`, `file_assoc`, `editor_host`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_Console", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_System_SystemInformation"] }

# The clipboard's audio (`audio_clipboard`) and process statistics (`cpu`).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSObjCRuntime", "NSString", "NSURL", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-quartz-core", "NSApplication", "NSColor", "NSCursor", "NSEvent", "NSCell", "NSGraphics", "NSMenu", "NSMenuItem", "NSPanel", "NSPasteboard", "NSResponder", "NSScreen", "NSTrackingArea", "NSView", "NSWindow"] }
