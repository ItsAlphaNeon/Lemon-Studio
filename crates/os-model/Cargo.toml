[package]
name = "os-model"
description = "Lemon Studio project data model"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
# Serde for every model type: Lemon project files keep undo steps (os-app `native`).
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
