[workspace]
resolver = "2"
members = ["crates/os-model", "crates/os-flp", "crates/os-engine", "tools/flp-dump", "tools/os-render", "tools/os-play", "crates/os-native", "tools/os-native-probe", "crates/os-theme", "crates/os-ui", "crates/os-app", "plugins/open-sampler", "tools/bundle-plugins", "crates/os-clap", "crates/os-hostlink"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
os-model = { path = "crates/os-model" }
os-flp = { path = "crates/os-flp" }
os-engine = { path = "crates/os-engine" }
os-hostlink = { path = "crates/os-hostlink" }
thiserror = "2"

[profile.dev]
opt-level = 3
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
