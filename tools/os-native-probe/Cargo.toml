[package]
name = "os-native-probe"
description = "Load one FL native plugin, print its info, render a test note"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
os-native = { path = "../../crates/os-native" }
os-engine.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }
