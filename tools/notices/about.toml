# cargo-about's settings for the Rust crates' section of THIRD-PARTY-NOTICES.txt (`cargo run -p notices`).

# The licences Lemon Studio takes the crates under, all compatible with the GPL version 3. For a crate that offers a
# choice ("MIT OR Apache-2.0"), the first one here that it offers is the one whose text the notices carry.
accepted = [
    "MIT",
    "MIT-0",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "LGPL-3.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
]

# vst3-sys says "GPLv3", which is no SPDX licence; its license.md grants version 3 or later.
[vst3-sys.clarify]
license = "GPL-3.0-or-later"

[[vst3-sys.clarify.files]]
path = "license.md"
license = "GPL-3.0-or-later"
checksum = "1be76dd654024ee690864bea328622e912847461671cee0533ddf9a2cab4a31d"
